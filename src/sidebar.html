<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sAIdebar</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sidebar-container">
    <!-- Header -->
    <div class="sidebar-header">
      <h1 class="sidebar-title">sAIdebar</h1>
      <div class="header-buttons">
        <button class="header-button" id="newChatButton" title="新規チャット">
          <i data-lucide="plus"></i>
        </button>
        <button class="header-button" id="settingsButton" title="Settings">
          <i data-lucide="settings"></i>
        </button>
        <button class="header-button" id="closeSidebarButton" title="Close Sidebar">
          <i data-lucide="x"></i>
        </button>
      </div>
    </div>

    <!-- Chat Timeline -->
    <div class="chat-timeline" id="chatTimeline">
      <div class="empty-state" id="emptyState">
        <p>お手伝いできることはありますか？</p>
      </div>
      <button class="summarize-button" id="summarizeButton">
        ページを要約
      </button>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-options">
        <label class="checkbox-label">
          <input type="checkbox" id="includePageContent">
          <span class="checkbox-text">ページの内容を含める</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="webSearch">
          <span class="checkbox-text">Web検索</span>
        </label>
      </div>
      <div class="input-wrapper">
        <textarea
          class="chat-input"
          id="chatInput"
          placeholder="質問してみましょう"
          rows="1"
        ></textarea>
        <button class="send-button" id="sendButton" title="Send" disabled>
          <i data-lucide="send"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Settings</h2>
        <button class="modal-close" id="closeSettings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="apiProvider">API Provider</label>
          <div class="select-wrapper">
            <select class="form-input form-select" id="apiProvider">
              <option value="anthropic">Anthropic</option>
              <option value="opencode-go">OpenCode Go</option>
              <option value="custom">カスタム</option>
            </select>
            <i data-lucide="chevron-down"></i>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="apiKey">API Key</label>
          <input
            type="password"
            class="form-input"
            id="apiKey"
            placeholder="sk-ant-..."
          >
        </div>
        <div class="form-group" id="customUrlGroup" style="display: none;">
          <label class="form-label" for="customApiUrl">Custom API URL</label>
          <input
            type="text"
            class="form-input"
            id="customApiUrl"
            placeholder="https://your-api-endpoint.com"
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="modelSelect">Model</label>
          <div class="model-select-wrapper">
            <div class="select-wrapper">
              <select class="form-input form-select" id="modelSelect" disabled>
                <option value="">モデルを取得してください</option>
              </select>
              <i data-lucide="chevron-down"></i>
            </div>
            <button class="btn btn-secondary btn-fetch-models" id="fetchModelsButton" type="button">
              取得
            </button>
          </div>
          <p class="form-hint" id="modelHint">API KeyとProviderを設定後、「取得」ボタンをクリック</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="tavilyApiKey">Tavily API Key</label>
          <input
            type="password"
            class="form-input"
            id="tavilyApiKey"
            placeholder="tvly-..."
          >
          <p class="form-hint">Web検索を使用する場合に必要です</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="systemPrompt">System Prompt</label>
          <textarea
            class="form-input form-textarea"
            id="systemPrompt"
            placeholder="Optional: Add custom instructions for the AI..."
            rows="4"
          ></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelSettings">Cancel</button>
        <button class="btn btn-primary" id="saveSettings">Save</button>
      </div>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
